<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GPS Tempo Real</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/leaflet/dist/leaflet.css" rel="stylesheet"/>
    <style>
        body { padding-top: 80px; }
        #mapaTempoReal {
            height: 500px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">📍 Controle de Ponto</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('pagina_funcionarios') }}">Funcionários</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('pagina_cadastro') }}">Cadastrar Funcionário</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('pagina_logs') }}">Logs</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('pagina_graficos') }}">Ver Gráficos</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('pagina_registros') }}">Registros</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('visualizar_rastreamento') }}">Rastreamento</a></li>
                <li class="nav-item"><a class="nav-link active" href="{{ url_for('visualizar_rastreamento_tempo_real') }}">GPS Tempo Real</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('pagina_reset_senha') }}">Resetar Senha</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('pagina_config_admin') }}">Configurações</a></li>
                <li class="nav-item"><a class="nav-link text-danger fw-bold" href="{{ url_for('logout') }}">🚪 Sair</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="text-center mb-4"><i class="bi bi-geo-alt-fill"></i> GPS Tempo Real</h3>

    <div class="row justify-content-center">
        <div class="col-md-5">
            <label class="form-label">Funcionário:</label>
            <select id="select-funcionario-tempo-real" class="form-select">
                <option value="">Selecione</option>
                {% for f in funcionarios %}
                <option value="{{ f.id }}" {% if request.args.get('funcionario_id') == f.id|string %}selected{% endif %}>{{ f.nome_completo }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="button" id="botao-buscar" class="btn btn-primary w-100">Buscar</button>
        </div>
    </div>

    <div id="mapaTempoReal"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='rastreamento_tempo_real.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
